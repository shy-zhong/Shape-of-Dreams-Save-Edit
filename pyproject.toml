[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sod-save-editor"
version = "1.1.0"
description = "《梦之形 / Shape of Dreams》存档修改器：解锁、星尘、统计、既视感"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "shy-zhong" }]
keywords = ["shape-of-dreams", "save-editor", "tkinter", "game-modding"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
sod-save-editor = "sod_save_editor.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sod_save_editor = ["assets/*.ico"]
